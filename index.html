<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Login — Laporan Harian Instalasi Farmasi</title>
  <meta name="theme-color" content="#16a34a" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="login-page">

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">💊</div>
        <h1>Laporan Harian</h1>
        <p>Instalasi Farmasi</p>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="ruangan">Pilih Ruangan</label>
          <select id="ruangan" required>
            <option value="">— Memuat ruangan… —</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pin">PIN Ruangan</label>
          <div class="pin-wrap">
            <input id="pin" type="password" inputmode="text" placeholder="Masukkan PIN" required />
            <button type="button" id="toggle-pin" class="pin-toggle" aria-label="Lihat PIN">👁</button>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn-primary">
          Masuk
        </button>

        <p id="login-error" class="login-error" hidden></p>
      </form>

      <p class="login-footer">© Instalasi Farmasi — Sistem Internal</p>
    </div>
  </div>

  <!-- Supabase JS via CDN -->
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
