<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Aplikasi Laporan Farmasi</title>
  <meta name="theme-color" content="#16a34a" />
  <link rel="stylesheet" href="assets/css/style.css" />
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body class="app-page">

  <!-- Overlay untuk mobile saat sidebar terbuka -->
  <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

  <!-- SIDEBAR KIRI -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="brand-icon">💊</span>
        <div>
          <h2>Laporan Farmasi</h2>
          <p>Instalasi Farmasi</p>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#/dashboard" class="nav-item" data-route="dashboard">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <a href="#/laporan-pelayanan" class="nav-item" data-route="laporan-pelayanan">
        <span class="nav-icon">📊</span> Laporan Pelayanan
      </a>
      <a href="#/laporan-harian" class="nav-item" data-route="laporan-harian">
        <span class="nav-icon">📅</span> Laporan Harian Terpadu
      </a>
      <a href="#/input" class="nav-item" data-route="input">
        <span class="nav-icon">📝</span> Input Laporan
      </a>
      <a href="#/staff" class="nav-item" data-route="staff">
        <span class="nav-icon">👥</span> Daftar Staff
      </a>
      <a href="#/pencarian-staff" class="nav-item" data-route="pencarian-staff">
        <span class="nav-icon">🔍</span> Cari Riwayat Staff
      </a>
      <a href="#/presensi" class="nav-item" data-route="presensi">
        <span class="nav-icon">📋</span> Presensi Staff
      </a>
      <a href="#/pengaturan" class="nav-item admin-only" data-route="pengaturan" hidden>
        <span class="nav-icon">⚙️</span> Pengaturan
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="btn-logout" class="btn-logout">
        <span class="nav-icon">🚪</span> Logout
      </button>
    </div>
  </aside>

  <!-- AREA KONTEN UTAMA -->
  <div class="main-wrapper">
    <!-- HEADER ATAS -->
    <header class="topbar">
      <button id="btn-toggle-sidebar" class="btn-hamburger" aria-label="Menu">☰</button>
      
      <div class="topbar-info">
        <h1 id="ruangan-nama">Memuat…</h1>
        <span id="user-role" class="badge">…</span>
      </div>

      <div class="topbar-user">
        <div id="user-avatar" class="avatar">?</div>
      </div>
    </header>

    <!-- TEMPAT KONTEN DINAMIS -->
    <main id="view" class="content-area">
      <div class="loading-state">
        <div class="spinner spinner-dark"></div> Memuat data…
      </div>
    </main>
  </div>

  <!-- Library untuk Grafik & Export -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  
  <!-- Library untuk Kalender (Flatpickr) -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Script Utama Aplikasi Anda -->
  <script type="module" src="assets/js/router.js"></script>
</body>
</html>
